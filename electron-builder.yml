appId: com.aventics.product-scraper
productName: AVENTICS Product Scraper
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
npmRebuild: true
directories:
  output: release
files:
  - out/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "AVENTICS-Product-Scraper-Setup-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  perMachine: false
